server.port=${SERVER_PORT:8081}

spring.application.name=${APP_NAME:fincore}


# =========================
# PostgreSQL
# =========================

spring.datasource.url=jdbc:postgresql://localhost:5432/fincore
spring.datasource.username=postgres
spring.datasource.password=post
spring.datasource.driver-class-name=org.postgresql.Driver


# =========================
# JPA / Hibernate
# =========================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


# =========================
# JWT
# =========================

jwt.secret=${JWT_SECRET:FinCore-development-secret-key-2026-change-this}
jwt.expiration=86400000


# =========================
# Logging
# =========================

logging.level.org.springframework=INFO
logging.level.com.fincore.backend=INFO
# Log SQL statements
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Log SQL with transaction details
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.transaction=TRACE
logging.level.org.springframework.orm.jpa=DEBUG

# =========================
# Error Handling
# =========================

server.error.include-message=always
server.error.include-binding-errors=always
# =========================
# HikariCP
# =========================

spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =========================
# Razorpay
# =========================

razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}


# Allows the 'Test credit (dev only)' button. MUST be false in production.
fincore.dev-funding-enabled=true

# ==========================================
# REDIS
# ==========================================

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:password}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Cache configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=5m
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true
spring.cache.redis.key-prefix=fincore:


# ==========================================
# RABBITMQ
# ==========================================

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Publisher reliability
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Consumer configuration
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.concurrency=2
spring.rabbitmq.listener.simple.max-concurrency=5